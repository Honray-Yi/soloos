[project]
name = "soloos-development"
version = "1.0.0"
description = "Development harness for the standalone SoloOS skill"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "PyYAML>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".agents/skills/soloos/scripts"]
addopts = "-ra"
